services:
  postgres:
    image: postgres:16-alpine
    container_name: vpnexues-postgres
    environment:
      POSTGRES_DB: vpnexues
      POSTGRES_USER: vpnexues
      POSTGRES_PASSWORD: vpnexues
    ports:
      - "5432:5432"
    volumes:
      - vpnexues-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpnexues -d vpnexues"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vpnexues-pg:
