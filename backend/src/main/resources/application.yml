server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: vpnexues-partner-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vpnexues}
    username: ${SPRING_DATASOURCE_USERNAME:vpnexues}
    password: ${SPRING_DATASOURCE_PASSWORD:vpnexues}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      connection-timeout: 5000
      data-source-properties:
        stringtype: unspecified
  flyway:
    # Never enable this against Supabase. The Java V1-V11 scripts are NOT
    # equivalent to the SQL 0001-0011 migrations already applied there.
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    default-property-inclusion: non_null

app:
  jwt-secret: ${APP_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-32bytes}
  access-token-ttl-seconds: ${APP_ACCESS_TOKEN_TTL_SECONDS:900}
  refresh-token-ttl-days: ${APP_REFRESH_TOKEN_TTL_DAYS:30}
  otp-ttl-seconds: ${APP_OTP_TTL_SECONDS:300}
  otp-max-attempts: ${APP_OTP_MAX_ATTEMPTS:5}
  migration-target: ${APP_MIGRATION_TARGET:none}
  otp-dev-echo: ${APP_OTP_DEV_ECHO:false}
  trial-mode: ${APP_TRIAL_MODE:false}
  cors-origins: ${APP_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://localhost:3000,http://localhost:8080,http://localhost:5199,http://localhost:5200}
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  instant-payout-fee-paise: ${APP_INSTANT_PAYOUT_FEE_PAISE:1000}
  instant-payout-min-paise: ${APP_INSTANT_PAYOUT_MIN_PAISE:10000}
  bootstrap-admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
  bootstrap-admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  bootstrap-admin-name: ${APP_BOOTSTRAP_ADMIN_NAME:Ops Owner}
  demo-seed: ${APP_DEMO_SEED:false}

logging:
  level:
    root: INFO
    com.vpnexues: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
