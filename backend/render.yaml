# Render Blueprint — trial deployment (API on Render, Postgres + file storage on Supabase).
# Render → New → Blueprint → pick this repo. Values marked `sync: false` are asked for once in the dashboard.
services:
  - type: web
    name: vpnexues-api
    runtime: node
    region: singapore            # closest Render region to India; create the Supabase project in Singapore too
    plan: free                   # sleeps after ~15 min idle (first request then takes ~1 min). "starter" stays awake.
    # NODE_ENV=production makes npm skip devDependencies (TypeScript, @types/node): include them for the build, then prune.
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: node dist/src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRIAL_MODE                  # keeps demo OTP codes on until SMS (Firebase) is wired up
        value: "true"
      - key: OTP_DEV_ECHO
        value: "true"
      - key: SMS_PROVIDER
        value: log
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        value: https://localhost,capacitor://localhost,http://localhost:5199,http://localhost:5200,https://vpnexues-admin.onrender.com   # app (APK), app dev server, admin console dev server, admin console (live)
      - key: DB_POOL_MAX
        value: "5"
      # --- generated by Render, never leave the dashboard ---
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY         # Render generates a base64 256-bit value = the 32-byte key we need.
        generateValue: true              # Don't change it later: saved bank account numbers are encrypted with it.
      # --- from Supabase ---
      - key: DATABASE_URL                # Connect → Session pooler URI (IPv4), with your DB password
        sync: false
      - key: DB_SSL_CA                   # Database settings → SSL → Download certificate (paste the PEM)
        sync: false
      - key: S3_ENDPOINT                 # Storage → S3 connection → Endpoint
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_SSE
        value: none
      - key: AWS_REGION                  # Storage → S3 connection → Region (e.g. ap-southeast-1)
        sync: false
      - key: AWS_ACCESS_KEY_ID           # Storage → S3 access keys → New access key
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_DOCUMENTS_BUCKET
        value: partner-documents
